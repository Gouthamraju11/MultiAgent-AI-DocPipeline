AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Event-driven document classification, extraction, and validation pipeline.

Parameters:
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Bedrock model available in the deployment Region.
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Exact web origin allowed to call the HTTP API.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: serverless/
    MemorySize: 1024
    Timeout: 120
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref JobsTable
        DOCUMENT_BUCKET: !Ref DocumentBucket
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        LOG_LEVEL: INFO

Resources:
  PipelineApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowHeaders: [content-type]
        AllowMethods: [GET, POST, OPTIONS]

  JobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  DocumentBucket:
    Type: AWS::S3::Bucket
    DependsOn: ClassificationQueuePolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireDocuments
            Status: Enabled
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt ClassificationQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  ClassificationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ExtractionDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ValidationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ClassificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ClassificationDLQ.Arn
        maxReceiveCount: 4

  ExtractionQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ExtractionDLQ.Arn
        maxReceiveCount: 4

  ValidationQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ValidationDLQ.Arn
        maxReceiveCount: 4

  ClassificationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref ClassificationQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowBucketNotifications
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ClassificationQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  CreateJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.create_job.lambda_handler
      Timeout: 15
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref JobsTable
        - S3WritePolicy:
            BucketName: !Ref DocumentBucket
      Events:
        CreateJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref PipelineApi
            Path: /jobs
            Method: POST

  GetJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.get_job.lambda_handler
      Timeout: 10
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobsTable
      Events:
        GetJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref PipelineApi
            Path: /jobs/{job_id}
            Method: GET

  ClassificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.classify.lambda_handler
      Environment:
        Variables:
          SOURCE_QUEUE_URL: !Ref ClassificationQueue
          NEXT_QUEUE_URL: !Ref ExtractionQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - S3CrudPolicy:
            BucketName: !Ref DocumentBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ExtractionQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
      Events:
        ClassificationMessages:
          Type: SQS
          Properties:
            Queue: !GetAtt ClassificationQueue.Arn
            BatchSize: 5
            FunctionResponseTypes: [ReportBatchItemFailures]

  ExtractionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.extract.lambda_handler
      Environment:
        Variables:
          SOURCE_QUEUE_URL: !Ref ExtractionQueue
          NEXT_QUEUE_URL: !Ref ValidationQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - S3ReadPolicy:
            BucketName: !Ref DocumentBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ValidationQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
      Events:
        ExtractionMessages:
          Type: SQS
          Properties:
            Queue: !GetAtt ExtractionQueue.Arn
            BatchSize: 5
            FunctionResponseTypes: [ReportBatchItemFailures]

  ValidationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.validate.lambda_handler
      Environment:
        Variables:
          SOURCE_QUEUE_URL: !Ref ValidationQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
      Events:
        ValidationMessages:
          Type: SQS
          Properties:
            Queue: !GetAtt ValidationQueue.Arn
            BatchSize: 5
            FunctionResponseTypes: [ReportBatchItemFailures]

  ClassificationDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Classification messages entered the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ClassificationDLQ.QueueName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ExtractionDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Extraction messages entered the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ExtractionDLQ.QueueName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ValidationDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Validation messages entered the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ValidationDLQ.QueueName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub https://${PipelineApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  DocumentBucketName:
    Description: Private document bucket
    Value: !Ref DocumentBucket
  JobsTableName:
    Description: DynamoDB audit and idempotency table
    Value: !Ref JobsTable
