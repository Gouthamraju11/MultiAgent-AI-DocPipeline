services:
  backend:
    build: ./backend
    environment:
      LLM_PROVIDER: mock
      CORS_ORIGINS: http://localhost:8080
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - 8080:80
    depends_on:
      backend:
        condition: service_healthy
